[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genshin-gitcg"
version = "0.0.0"
description = "Genius Invokation TCG AI + Agent engineering (SoG/ReBeL route)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
dependencies = ["gitcg>=0.21.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2"]
train = ["torch>=2.2"]

[tool.setuptools]
packages = [
    "common",
    "envs",
    "reps",
    "agents",
    "agents.scripted",
    "agents.scripted.deck_rules",
    "eval",
    "coach",
    "decklab",
    "train",
    "scripts",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
    "network: requires network access",
]
